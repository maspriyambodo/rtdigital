name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: services/api/go.sum

      - name: Download modules
        run: go mod download

      - name: Check formatting
        run: |
          files="$(gofmt -s -l .)"
          test -z "$files" || { printf '%s\n' "$files"; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Start integration services
        run: docker compose -f ../../docker-compose.yml up -d postgres redis minio minio-init

      - name: Wait for integration services
        run: |
          for attempt in $(seq 1 30); do
            postgres_ready="$(docker compose -f ../../docker-compose.yml ps --format json | jq -r 'select(.Service == "postgres") | .Health')"
            minio_ready="$(docker compose -f ../../docker-compose.yml ps --format json | jq -r 'select(.Service == "minio") | .Health')"
            minio_init_exit="$(docker compose -f ../../docker-compose.yml ps --format json | jq -r 'select(.Service == "minio-init") | .ExitCode')"
            if [ "$postgres_ready" = "healthy" ] && [ "$minio_ready" = "healthy" ] && [ "$minio_init_exit" = "0" ]; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f ../../docker-compose.yml ps
          docker compose -f ../../docker-compose.yml logs --no-color
          exit 1

      - name: Unit and integration tests
        env:
          DATABASE_URL: postgres://rtdigital:rtdigital_local_only@localhost:5432/rtdigital?sslmode=disable
          R2_ENDPOINT: http://localhost:9000
          R2_BUCKET: rtdigital-local
          R2_ACCESS_KEY_ID: minioadmin
          R2_SECRET_ACCESS_KEY: minioadmin
          R2_USE_PATH_STYLE: "true"
        run: go test -race -v ./...

      - name: Build binary
        run: go build ./cmd/api

      - name: Build API image
        run: docker build -f ../../infrastructure/docker/api/Dockerfile -t rtdigital-api:ci .

      - name: Stop integration services
        if: always()
        run: docker compose -f ../../docker-compose.yml down -v

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: "10.33.2"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --dir apps/web lint

      - name: Type check
        run: pnpm --dir apps/web exec tsc --noEmit

      - name: Build OpenNext worker
        run: pnpm --dir apps/web build:worker